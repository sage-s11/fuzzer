// named.conf - BIND9 main configuration for fuzzing target
// Deliberately permissive — we want the server to accept queries
// from anywhere so the fuzzer can reach it without ACL restrictions.

options {
    directory "/var/cache/bind";

    // Accept queries from any source (fuzzer running on host)
    allow-query     { any; };
    allow-recursion { any; };

    // Disable DNSSEC validation (not what we're testing)
    dnssec-validation no;

    // Listen on all interfaces, port 53
    listen-on      { any; };
    listen-on-v6   { any; };

    // Enable EDNS (important — many vuln classes are in EDNS handling)
    edns-udp-size 4096;

    // Rate limiting OFF — we want to receive all the fuzzer's packets
    // rate-limit { responses-per-second 0; };

    // Logging to stdout so we can see crashes in docker logs
    recursion yes;
};

// Include local zone definitions
include "/etc/bind/named.conf.local";
